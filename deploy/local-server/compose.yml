name: rawaqan

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rawaqan}
    volumes:
      - rawaqan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    shm_size: 128mb
    mem_limit: 512m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: rawaqan-api:local
    restart: unless-stopped
    env_file:
      - ${RAWAQAN_RUNTIME_ENV_FILE:-runtime.env}
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rawaqan}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rawaqan}?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${RAWAQAN_BIND_IP:-127.0.0.1}:${RAWAQAN_API_PORT:-4000}:4000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    image: rawaqan-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${RAWAQAN_WEB_PORT:-8280}:80
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  rawaqan_pgdata:

networks:
  backend:
    driver: bridge
