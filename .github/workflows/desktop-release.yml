name: Release POS desktop update

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: pos-desktop-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows update
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop version $version (expected $expectedTag)."
          }

      - name: Install application dependencies
        run: npm ci

      - name: Install desktop build dependencies
        run: npm ci --prefix desktop

      - name: Test desktop updater
        run: npm test --prefix desktop

      - name: Run standalone POS safety tests
        run: npm run test --workspace frontend -- src/pos/auth/PosProtectedRoute.test.tsx src/pos/auth/offline.test.ts src/pos/db/backup.test.ts src/pos/commands/localCommands.test.ts src/pos/sync/engine.test.ts src/pos/printing/ReceiptPrinter.test.ts src/pos/pages/CheckoutPage.test.tsx

      - name: Build NSIS installer and update metadata
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist:win --prefix desktop

      - name: Verify installer and update files
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          $installer = Get-ChildItem desktop/release/*.exe | Select-Object -First 1
          $metadata = Get-Item desktop/release/latest.yml
          $blockmap = Get-ChildItem desktop/release/*.blockmap | Select-Object -First 1
          if (-not $installer -or -not $metadata -or -not $blockmap) {
            throw "Installer, latest.yml, or blockmap is missing."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($env:SIGNING_CONFIGURED -and $signature.Status -ne 'Valid') {
            throw "Configured installer signature is not valid: $($signature.Status)"
          }
          if (-not $env:SIGNING_CONFIGURED) {
            Write-Warning "This release is unsigned. Configure WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD for publisher-verified updates."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem desktop/release/*.exe
            Get-ChildItem desktop/release/*.blockmap
            Get-Item desktop/release/latest.yml
          ) | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --latest --generate-notes --title "Rawaqan POS $env:GITHUB_REF_NAME"
