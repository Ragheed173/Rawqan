name: Production readiness

on:
  schedule:
    # Twice per hour. This provides outage detection without continuously
    # keeping the free Render instance awake.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: true

jobs:
  readiness:
    name: API and database readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production readiness
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl \
            --silent \
            --show-error \
            --fail \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 15 \
            --max-time 90 \
            https://rawaqan-api.onrender.com/ready)"

          READY_RESPONSE="$response" node <<'NODE'
          const response = JSON.parse(process.env.READY_RESPONSE ?? "null");
          if (
            response?.status !== "ready" ||
            response?.checks?.database?.status !== "ok"
          ) {
            console.error("Production API or database is not ready.");
            process.exit(1);
          }
          console.log(
            `Production is ready; database latency ${response.checks.database.latencyMs} ms.`,
          );
          NODE

      - name: Notify the operational webhook on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${ALERT_WEBHOOK_URL}" ]]; then
            echo "ALERT_WEBHOOK_URL is not configured; GitHub failure notification remains active."
            exit 0
          fi
          payload="$(jq -cn \
            --arg text "Rawaqan production readiness failed" \
            --arg run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{text: $text, run: $run}')"
          curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 20 \
            -H "content-type: application/json" \
            --data "$payload" "$ALERT_WEBHOOK_URL"
